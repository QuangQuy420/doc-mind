[project]
name = "docmind-shared"
version = "0.0.0"
description = "Shared Pydantic models, enums and event schemas for DocMind"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docmind_shared"]
