[project]
name = "docmind-api"
version = "0.0.0"
description = "DocMind HTTP API (FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "boto3>=1.35",
    "PyJWT[crypto]>=2.9",
    "structlog>=24.4",
    "docmind-shared",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "moto[dynamodb]>=5.0",
    "boto3-stubs[dynamodb]>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
