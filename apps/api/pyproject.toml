[project]
name = "docmind-api"
version = "0.0.0"
description = "DocMind HTTP API (FastAPI arrives in P7)"
requires-python = ">=3.12,<3.13"
dependencies = ["docmind-shared"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
